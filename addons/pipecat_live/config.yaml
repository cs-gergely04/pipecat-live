name: Pipecat Live
version: "0.1.80"
slug: pipecat_live
description: Realtime Pipecat Live assistant for Home Assistant with Gemini Live, MCP device control and ESP32 satellite support.
url: https://github.com/cs-gergely04/pipecat-gemini
image: ghcr.io/cs-gergely04/pipecat-gemini/pipecat-live
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
ingress: true
ingress_port: 7865
panel_icon: mdi:account-voice
homeassistant_api: true
hassio_api: true
hassio_role: manager
options:
  runner_port: 7865
  log_level: "INFO"
schema:
  runner_port: port
  log_level: list(DEBUG|INFO|WARNING|ERROR)
